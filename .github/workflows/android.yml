name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Web faýllaryny taýýarla
        run: |
          mkdir -p www
          cp index.html www/

      - name: Paketleri gur
        run: npm install

      - name: Android taslamasyny döret
        run: |
          npx cap add android
          npx cap sync android

      - name: APK gur
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: APK-ny ýükle
        uses: actions/upload-artifact@v4
        with:
          name: ZIPPY-WORLD-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
